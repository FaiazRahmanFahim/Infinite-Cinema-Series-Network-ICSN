<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ICSN" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/favicon.svg" color="#863bff" />
  <title>ICSN — Infinite Cinema & Series Network</title>
  <meta name="description"
    content="Discover popular movies, series, and trending content on ICSN — Infinite Cinema & Series Network." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('icsn-theme');

        if (saved) {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          const prefersDark =
            window.matchMedia('(prefers-color-scheme: dark)').matches;

          document.documentElement.setAttribute(
            'data-theme',
            prefersDark ? 'dark' : 'light'
          );
        }
      } catch (_) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
