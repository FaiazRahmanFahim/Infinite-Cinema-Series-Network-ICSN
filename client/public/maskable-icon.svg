<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="50%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="mLogoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e14ff" />
      <stop offset="35%" stop-color="#863bff" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="mAmbientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Full Bleed Background for Maskable Icon Safezone -->
  <rect width="512" height="512" fill="url(#mBgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#863bff" opacity="0.25" filter="url(#mAmbientGlow)" />
  <circle cx="310" cy="220" r="110" fill="#38bdf8" opacity="0.2" filter="url(#mAmbientGlow)" />

  <!-- Centered Scaled Logo inside 80% safe zone -->
  <g transform="translate(122, 116) scale(5.6)">
    <path fill="url(#mLogoGrad)" filter="url(#mAmbientGlow)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
  </g>
</svg>
