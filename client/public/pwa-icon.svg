<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="50%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#47bfff" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#863bff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Logo Primary Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e14ff" />
      <stop offset="35%" stop-color="#863bff" />
      <stop offset="70%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="32" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#863bff" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" filter="url(#softShadow)" />

  <!-- Ambient Radial Aura -->
  <circle cx="256" cy="256" r="140" fill="#863bff" opacity="0.22" filter="url(#ambientGlow)" />
  <circle cx="310" cy="220" r="100" fill="#38bdf8" opacity="0.18" filter="url(#ambientGlow)" />

  <!-- ICSN Ribbon Logo -->
  <g transform="translate(96, 90) scale(6.67)">
    <path fill="url(#logoGrad)" filter="url(#ambientGlow)" d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z" />
    
    <!-- Specular highlight accents -->
    <path fill="#ffffff" opacity="0.3" d="M10.933 0h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L42.5 23l-3.5-3.5 6-7h-9.5c-2.5 0-3.8-2.6-2.5-4.5L39.5 2H11L9 4l1.933-4z" />
  </g>
</svg>
